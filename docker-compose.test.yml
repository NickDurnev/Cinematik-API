version: '3.8'

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: cinematik-test-db
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password_change_me
      POSTGRES_DB: cinematik_test
    ports:
      - "5432:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d cinematik_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_test_data:
